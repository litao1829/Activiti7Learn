#user  nobody;
worker_processes  1;

events {
    worker_connections  1024;
}
http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name git.hiss.com;
        location / {
            proxy_pass http://192.168.126.128:11080;
        }
    }

    upstream  hiss-dev {
        server 192.168.126.1:8081;
    }

    server {
        listen 80;
        server_name dev.hiss.com;
        location / {
            root /usr/share/nginx/html/hiss-designer-ui/;
            index index.html;
        }

        location ~/api/(.*) {
            proxy_pass http://hiss-dev/$1;
            proxy_set_header HOST $host;  # 不改变源请求头的值
            proxy_pass_request_body on;  #开启获取请求体
            proxy_pass_request_headers on;  #开启获取请求头
            proxy_set_header X-Real-IP $remote_addr;   # 记录真实发出请求的客户端IP
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  #记录代理信息
        }

        location /v1/receiver {
            proxy_pass http://hiss-dev/v1/receiver;
            proxy_set_header HOST $host;  # 不改变源请求头的值
            proxy_pass_request_body on;  #开启获取请求体
            proxy_pass_request_headers on;  #开启获取请求头
            proxy_set_header X-Real-IP $remote_addr;   # 记录真实发出请求的客户端IP
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  #记录代理信息
        }
    }

    server {
        listen 80;
        server_name center.hiss.com;
        location / {
            root /usr/share/nginx/html/hiss-center-ui/;
            index index.html;
        }

        location ~/api/(.*) {
            proxy_pass http://hiss-dev/$1;
            proxy_set_header HOST $host;  # 不改变源请求头的值
            proxy_pass_request_body on;  #开启获取请求体
            proxy_pass_request_headers on;  #开启获取请求头
            proxy_set_header X-Real-IP $remote_addr;   # 记录真实发出请求的客户端IP
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  #记录代理信息
        }

        location /v1/receiver {
            proxy_pass http://hiss-dev/v1/receiver;
            proxy_set_header HOST $host;  # 不改变源请求头的值
            proxy_pass_request_body on;  #开启获取请求体
            proxy_pass_request_headers on;  #开启获取请求头
            proxy_set_header X-Real-IP $remote_addr;   # 记录真实发出请求的客户端IP
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  #记录代理信息
        }
    }

}
